version: '3.8'

services:
  postgres-postgis:
    image: postgis/postgis:15-3.3
    container_name: civix_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: civix_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civix_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civix_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civix_backend
    environment:
      - POSTGRES_SERVER=postgres-postgis
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=civix_ai_db
      - REDIS_URL=redis://redis:6379/0
      - BLOCKCHAIN_ENABLED=true
      - BLOCKCHAIN_PROVIDER=mock
    ports:
      - "8000:8000"
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civix_worker
    command: python -m app.workers.tasks
    environment:
      - POSTGRES_SERVER=postgres-postgis
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=civix_ai_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgis_data:
